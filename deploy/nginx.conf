server {
    listen 80;
    server_name TU_IP_O_DOMINIO;

    # ── Laravel API ──────────────────────────────────────────
    # Todo lo que empiece con /api va a Laravel
    location ^~ /api {
        alias /var/www/backend/public;
        try_files $uri $uri/ @laravel;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            include fastcgi_params;
        }
    }

    location @laravel {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param PATH_INFO $uri;
        include fastcgi_params;
    }

    # Archivos estáticos de Laravel (storage)
    location ^~ /storage {
        alias /var/www/backend/public/storage;
    }

    # ── Next.js Frontend ─────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
